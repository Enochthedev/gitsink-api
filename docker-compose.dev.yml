# ============================================
# Development Docker Compose Configuration
# ============================================
version: '3.8'

services:
  # ============================================
  # API Service - Development
  # ============================================
  gitsink-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: gitsink-api:dev
    container_name: gitsink-api-dev
    restart: unless-stopped
    env_file: .env.development
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3000:3000"
      - "9229:9229" # Debug port
    volumes:
      - .:/app:cached
      - /app/node_modules
      - /app/dist
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: npm run start:dev

  # ============================================
  # Database - Development
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: gitsink-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitsink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-gitsink_dev}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitsink} -d ${POSTGRES_DB:-gitsink_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache - Development
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: gitsink-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Development Tools
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander-dev
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - app-network
    depends_on:
      - redis
    profiles:
      - tools

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gitsink.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-password}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    ports:
      - "8080:80"
    networks:
      - app-network
    depends_on:
      - postgres
    profiles:
      - tools

  # ============================================
  # Documentation - Development
  # ============================================
  docs:
    build:
      context: ./gitsink-docs
      dockerfile: Dockerfile
    container_name: gitsink-docs-dev
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - ./gitsink-docs:/app:cached
      - /app/node_modules
    networks:
      - app-network
    profiles:
      - docs

# ============================================
# Networks
# ============================================
networks:
  app-network:
    driver: bridge
    name: gitsink-network-dev

# ============================================
# Volumes
# ============================================
volumes:
  postgres_dev_data:
    name: gitsink-postgres-data-dev
  redis_dev_data:
    name: gitsink-redis-data-dev
  pgadmin_dev_data:
    name: gitsink-pgadmin-data-dev