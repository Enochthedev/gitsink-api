name: Validate Markdown

on:
  pull_request:
    paths:
      - 'docs/portfolio.md'
      - '.github/workflows/validate-markdown.yml'
      - 'src/parser/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx ts-node scripts/validate-markdown.ts docs/portfolio.md