name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build + Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run ESLint (allow warnings)
        run: |
          npx eslint "{src,apps,libs}/**/*.ts" --max-warnings=100 || echo "Warnings found but not failing"

      - name: Build API
        run: npm run build