services:
  # ============================================
  # API Service
  # ============================================
  gitsink-api:
    build:
      context: .
      target: production
      args:
        - NODE_ENV=production
    container_name: gitsink-api
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # Documentation Site (separate service)
  # ============================================
  docs:
    build:
      context: ./gitsink-docs
      dockerfile: Dockerfile
    container_name: gitsink-docs
    restart: unless-stopped
    ports:
      - "3002:3000"
    networks:
      - app-network
    profiles:
      - docs # Only start with --profile docs

  # ============================================
  # Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: gitsink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432" # Remove in production

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: gitsink-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379" # Remove in production

  # ============================================
  # Monitoring Stack
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: gitsink-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: gitsink-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    networks:
      - app-network
    profiles:
      - monitoring

  # ============================================
  # Reverse Proxy
  # ============================================
  caddy:
    image: caddy:2-alpine
    container_name: gitsink-proxy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./gitsink-docs/build:/app/gitsink-docs/build 
    depends_on:
      gitsink-api:
        condition: service_healthy
    networks:
      - app-network

# ============================================
# Networks
# ============================================
networks:
  app-network:
    driver: bridge
    name: gitsink-network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    name: gitsink-postgres-data
  prometheus_data:
    name: gitsink-prometheus-data
  grafana_data:
    name: gitsink-grafana-data
  caddy_data:
    name: gitsink-caddy-data
  caddy_config:
    name: gitsink-caddy-config
  redis_data:
    name: gitsink-redis-data